# ~/.hermes/dashboard-themes/win11-purple.yaml
# Windows 11 Fluent 风格 · 柔和紫 · 护眼
# v2：整体降低饱和度/对比度，更柔和不刺眼
# 深色 Mica 材质 + 柔和紫罗兰强调色，接近 Win11 默认壁纸的紫色调
name: win11-purple
label: Win11 Purple
description: Windows 11 Fluent 风格 — 柔和紫 · 深色 Mica · 护眼大字

# 3 层调色板：柔和深紫灰画布（Mica 深色材质）+ 低亮度淡紫白文字 + 轻光晕
palette:
  background:
    hex: "#211c30"        # 柔和深紫灰（比 v1 稍亮稍灰，降低与文字的对比）
    alpha: 1.0
  midground:
    hex: "#d6d0ea"        # 主文字：低亮度淡紫白（对比度约 11:1，舒适而非刺眼）
    alpha: 1.0
  foreground:
    hex: "#ffffff"
    alpha: 0.0            # 顶层高光默认不可见
  warmGlow: "rgba(167, 139, 250, 0.16)"   # 淡紫光晕（比 v1 降 40% 浓度）
  noiseOpacity: 0.25      # 颗粒更淡，画面更干净

typography:
  fontSans: '"Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'
  fontMono: '"Cascadia Code", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace'
  fontDisplay: '"Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif'
  baseSize: "17px"        # 默认 15px → 放大到 17px，护眼
  lineHeight: "1.6"
  letterSpacing: "0"

layout:
  radius: "0.75rem"       # Fluent 圆角（比默认 0.5rem 更圆润）
  density: comfortable

layoutVariant: standard

# 柔和紫色强调色（v2：从 #8B5CF6 降饱和到 #8F7FE0 系，接近 Win11 原生紫）
colorOverrides:
  primary: "#8f7fe0"
  primaryForeground: "#ffffff"
  accent: "#a99be8"
  accentForeground: "#211c30"
  secondary: "rgba(143, 127, 224, 0.14)"
  secondaryForeground: "#e2dcf2"
  muted: "rgba(255, 255, 255, 0.05)"
  mutedForeground: "#a39bc0"
  card: "rgba(255, 255, 255, 0.035)"
  cardForeground: "#d6d0ea"
  popover: "#282238"
  popoverForeground: "#d6d0ea"
  border: "rgba(255, 255, 255, 0.07)"
  input: "rgba(255, 255, 255, 0.09)"
  ring: "#8f7fe0"
  destructive: "#e8808a"
  destructiveForeground: "#ffffff"
  success: "#7ad9a0"
  warning: "#e8c06a"

# 半透明卡片 + 柔和阴影（v2：阴影更轻、卡片更淡）
componentStyles:
  card:
    background: "rgba(255, 255, 255, 0.035)"
    boxShadow: "0 3px 16px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.05)"
  header:
    background: "rgba(33, 28, 48, 0.7)"
    backdropFilter: "blur(18px) saturate(140%)"
    borderBottom: "1px solid rgba(255, 255, 255, 0.06)"
  sidebar:
    background: "rgba(255, 255, 255, 0.025)"
  tab:
    borderRadius: "0.5rem"

customCSS: |
  /* Win11 Mica 模拟：淡紫色光晕透出（v2 浓度大幅降低，更柔和） */
  body {
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(167, 139, 250, 0.10), transparent 60%),
      radial-gradient(900px 600px at 105% 15%, rgba(169, 155, 232, 0.08), transparent 55%),
      radial-gradient(700px 500px at 50% 110%, rgba(143, 127, 224, 0.06), transparent 60%),
      var(--background) !important;
    background-attachment: fixed !important;
  }

  /* 亮色聊天区（气泡视图）：Win11 亮色 Mica 质感。
     作用域变量覆盖 —— 只影响 [data-chat-surface] 内部，终端/侧栏保持深色。
     Tailwind v4 @theme inline 把 utility 内联为 color-mix(... var(--midground-base)
     / var(--background-base))，因此覆盖这三个底层变量即可整体翻转。 */
  [data-chat-surface] {
    --midground: #2b2440;              /* 文字：深紫灰 */
    --midground-base: #2b2440;
    --background: #f7f5fc;             /* 聊天区背景：亮紫白 */
    --background-base: #f7f5fc;
    --text-secondary: #6b6488;         /* DS 次级文字 */
    --text-tertiary: #8a84a8;          /* DS 三级文字 */
    background-color: #f7f5fc;
    border-radius: 0.5rem;
  }

  /* 亮底上加深状态色（text-success 等编译为固定值，需选择器覆盖） */
  [data-chat-surface] .text-success { color: #16a34a; }
  [data-chat-surface] .text-warning { color: #b45309; }
  [data-chat-surface] .bg-success\/15 { background-color: rgba(22, 163, 74, 0.15); }
  [data-chat-surface] .bg-warning\/10 { background-color: rgba(180, 83, 9, 0.12); }

  /* 工具栏（用量条 + 会话状态栏 + 操作按钮）——亮底柔和紫配色。
     亮色聊天区把 --midground 覆盖为深紫灰 #2b2440 用于正文，而 Tailwind
     @theme inline 把 text-primary/bg-primary/bg-secondary/border-border 等
     utility 内联引用 --midground —— 直接导致工具栏发黑发脏。
     这里在 [data-toolbar] 作用域内把派生色重新指向柔和紫 #8F7FE0 系。 */
  [data-chat-surface] [data-toolbar] {
    --toolbar-accent: #8f7fe0;                    /* 主紫 */
    --toolbar-accent-strong: #7a6bd0;             /* 深一点（hover/填充） */
    --toolbar-accent-soft: rgba(143, 127, 224, 0.12);  /* 淡紫底 */
    --toolbar-accent-softer: rgba(143, 127, 224, 0.07); /* 更淡底 */
    --toolbar-border: rgba(143, 127, 224, 0.28);  /* 紫描边 */
    --toolbar-text: #6b6488;                      /* 次级文字：灰紫 */
  }
  [data-chat-surface] [data-toolbar] .text-primary { color: var(--toolbar-accent) !important; }
  [data-chat-surface] [data-toolbar] .text-text-secondary { color: var(--toolbar-text) !important; }
  [data-chat-surface] [data-toolbar] .text-text-tertiary { color: #8a84a8 !important; }
  [data-chat-surface] [data-toolbar] .bg-primary\/70 { background-color: var(--toolbar-accent) !important; }
  [data-chat-surface] [data-toolbar] .bg-primary\/10 { background-color: var(--toolbar-accent-soft) !important; }
  [data-chat-surface] [data-toolbar] .bg-secondary\/30 { background-color: var(--toolbar-accent-soft) !important; }
  [data-chat-surface] [data-toolbar] .bg-secondary\/40 { background-color: var(--toolbar-accent-softer) !important; }
  [data-chat-surface] [data-toolbar] .hover\:bg-secondary\/50:hover { background-color: var(--toolbar-accent-soft) !important; }
  [data-chat-surface] [data-toolbar] .border-border\/60 { border-color: var(--toolbar-border) !important; }
  [data-chat-surface] [data-toolbar] .bg-destructive\/15 { background-color: rgba(224, 128, 138, 0.14) !important; }
  [data-chat-surface] [data-toolbar] .border-destructive\/50 { border-color: rgba(224, 128, 138, 0.45) !important; }
  [data-chat-surface] [data-toolbar] .text-destructive { color: #c04854 !important; }

  /* 侧栏 / 导航区略带 Mica 通透感 */
  [data-layout-variant="standard"] aside,
  [data-layout-variant="standard"] nav {
    backdrop-filter: blur(8px);
  }

  /* 滚动条 — 更细更柔，低饱和紫 */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: rgba(143, 127, 224, 0.22);
    border-radius: 8px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(143, 127, 224, 0.36);
  }

  /* 选中文字 — 低饱和紫高亮 */
  ::selection {
    background: rgba(143, 127, 224, 0.28);
  }

  /* 链接 hover — 柔和紫下划线 */
  a:hover {
    text-decoration-color: rgba(169, 155, 232, 0.7);
  }
